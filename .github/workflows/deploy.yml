name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @zxing/library verlangt Node >= 24; mit älteren Versionen läuft
          # der Build zwar, npm ci meckert aber bei jedem Lauf.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # GitHub Pages liefert für unbekannte Pfade 404.html aus. Ohne diese
      # Kopie endet ein direkt aufgerufener Deep-Link wie /buechermonster/buch/1
      # auf der 404-Seite, solange der Service Worker noch nicht aktiv ist.
      - name: SPA-Fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
